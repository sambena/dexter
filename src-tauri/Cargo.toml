[package]
name = "rom-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "rom-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rom_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Command-line front end to the same commands the window uses. A separate
# binary because the app itself is a GUI-subsystem exe in release builds,
# which can't write to the terminal that started it.
[[bin]]
name = "dexter-cli"
path = "src/bin/dexter-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
crc32fast = "1"
md-5 = "0.10"
sha1 = "0.10"
quick-xml = { version = "0.36", features = ["serialize"] }
walkdir = "2"
zip = "2"
reqwest = { version = "0.12", features = ["blocking"] }
thiserror = "1"
anyhow = "1"
chrono = "0.4"
regex = "1"
base64 = "0.22"
trash = "5"
tiny_http = "0.12"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
# GetDriveTypeW, so emulator detection skips network and removable drives.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
